[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clawvision"
version = "0.22.0"
description = "Experiment tracking, visualization and AI 3D Studio SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ClawVision contributors"}]
dependencies = []

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.15"]
parquet = ["pyarrow>=17", "duckdb>=1.3"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
synthesis = ["numpy>=2,<3"]
vision = ["numpy>=2,<3", "Pillow>=11,<13", "pyarrow>=17"]
dev = ["coverage>=7.6", "ruff>=0.9"]
ml-ecosystem = ["tensorboard>=2.19,<3", "transformers>=4.53,<5", "keras>=3.10,<4", "lightning>=2.5,<3", "accelerate>=1.9,<2", "mlflow>=3.1,<4", "wandb>=0.21,<0.29"]

[project.scripts]
clawvision = "clawvision.cli:main"

[tool.setuptools]
package-dir = {"" = "sdk"}

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.ruff]
target-version = "py310"
line-length = 180
extend-exclude = ["data", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["backend", "sdk/clawvision"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
