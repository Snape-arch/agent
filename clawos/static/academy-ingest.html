<main class="academy-module-main"><section class="academy-module-heading"><span class="academy-kicker">Knowledge Ingest</span><h1>只沉淀值得再次找到的内容。</h1><p>选择学习产物，补齐来源、分类与证据，再进入真实知识库；未提交内容只保留在本地队列。</p></section><section class="ingest-studio"><div class="ingest-source-grid academy-ingest-list"><button type="button" onclick="academyQueueKnowledge('paper')"><span class="fluent-icon" aria-hidden="true">&#xE8A5;</span><b>论文精读</b><small>概念、引用证据与实验设计</small></button><button type="button" onclick="academyQueueKnowledge('note')"><span class="fluent-icon" aria-hidden="true">&#xE70B;</span><b>学习笔记</b><small>解释、例子与复盘问题</small></button><button type="button" onclick="academyQueueKnowledge('experiment')"><span class="fluent-icon" aria-hidden="true">&#xE943;</span><b>代码实验</b><small>输入、指标、失败与结论</small></button><button type="button" onclick="academyQueueKnowledge('quiz')"><span class="fluent-icon" aria-hidden="true">&#xE9D9;</span><b>测试错题</b><small>薄弱点与补学路径</small></button></div><aside class="ingest-queue"><div class="reader-pane-head"><div><span>Local Queue</span><b>待沉淀内容</b></div></div><div class="academy-output" id="academyIngestStatus"><b>队列为空</b><p>选择左侧产物后，这里会显示真实待提交项。</p></div><div class="ingest-policy"><span class="fluent-icon" aria-hidden="true">&#xEA18;</span><div><b>来源优先</b><small>不暴露本地路径；保留可追溯来源和引用定位。</small></div></div></aside></section></main><script src="/assets/academy.js"></script></body></html>
