<main class="academy-module-main"><section class="academy-module-heading"><span class="academy-kicker">Guided Notes</span><h1>把摘录，变成自己的理解。</h1><p>以 Cornell 结构组织线索、解释、例子、反例与复盘问题，并保留原始观点和二次改写的边界。</p></section><section class="notes-studio"><aside class="notes-template-rail"><div class="reader-pane-head"><div><span>Template</span><b>笔记方法</b></div></div><button class="active"><span class="fluent-icon" aria-hidden="true">&#xE70B;</span><div><b>Cornell Note</b><small>线索、正文、总结</small></div></button><button><span class="fluent-icon" aria-hidden="true">&#xE8D2;</span><div><b>概念卡</b><small>定义、例子、边界</small></div></button><button><span class="fluent-icon" aria-hidden="true">&#xE9D9;</span><div><b>实验复盘</b><small>假设、结果、失败</small></div></button></aside><section class="notes-editor"><label><span>原始材料</span><textarea id="academyNoteInput" placeholder="粘贴课堂笔记、论文段落或实验观察。"></textarea></label><div class="notes-guide-row"><button type="button" onclick="academyInsertNotePrompt('explain')">用自己的话解释</button><button type="button" onclick="academyInsertNotePrompt('example')">补一个例子与反例</button><button type="button" onclick="academyInsertNotePrompt('question')">提出可验证问题</button></div><button class="pill solid dark" type="button" onclick="academyGenerateNote()"><span class="fluent-icon" aria-hidden="true">&#xE945;</span>生成结构化草稿</button></section><aside class="notes-preview"><div class="reader-pane-head"><div><span>Preview</span><b>结构化笔记</b></div><button class="icon-button" type="button" onclick="academyExportNote()" title="导出 Markdown"><span class="fluent-icon" aria-hidden="true">&#xE896;</span></button></div><div class="academy-output" id="academyNoteOutput"><b>等待导写</b><p>生成后仍可编辑，并由你决定是否写入知识库。</p></div></aside></section></main><script src="/assets/academy.js"></script></body></html>
