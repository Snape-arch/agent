<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClawOS · 学习文档</title><link rel="icon" href="/assets/brand/favicon-32.png"><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/assets/academy-documents.css?v=20261002-release"></head>
<body><a class="skip" href="#docBlocks">跳到文档内容</a>
<aside class="doc-rail"><a class="doc-brand" href="/academy"><img src="/assets/brand/clawos-logo-dark.png" alt="" width="28" height="28"> ClawOS <small>学习文档</small></a><button id="docNew" class="primary">＋ 新建文档</button><nav id="docLibrary" aria-label="我的文档"></nav><div class="doc-rail-foot"><a href="/academy/paper">← 回到文献阅读</a><a href="/academy/materials">今日学习计划</a></div></aside>
<main class="doc-shell"><header class="doc-topbar"><span id="docStatus" role="status" aria-live="polite">载入文档…</span><div><button id="docFocus">专注写作</button><button id="docHistory">版本记录</button><button id="docSave">保存</button><select id="docExport" aria-label="导出文档"><option value="">导出…</option><option value="markdown">Markdown</option><option value="json">可编辑 JSON</option></select></div></header>
<div class="doc-toolbar" role="toolbar" aria-label="文档编辑工具"><button id="docUndo" title="Ctrl+Z">撤销</button><button id="docRedo" title="Ctrl+Shift+Z">重做</button><span class="doc-separator"></span><button data-format="bold" title="Ctrl+B"><b>B</b></button><button data-format="italic" title="Ctrl+I"><i>I</i></button><button data-format="strike"><s>S</s></button><button data-format="inlinecode">行内代码</button><button data-format="link">链接</button><select id="docInsert" aria-label="插入内容块"><option value="">＋ 插入内容块</option><option value="paragraph">正文</option><option value="heading">标题</option><option value="quote">引用</option><option value="bullet">项目列表</option><option value="numbered">编号列表</option><option value="callout">提示框</option><option value="todo">待办事项</option><option value="code">代码块</option><option value="table">表格</option><option value="image">图片</option><option value="drawing">绘图</option><option value="divider">分隔线</option></select><select id="docTemplate" aria-label="添加学习模板"><option value="">学习模板</option><option value="cornell">Cornell 笔记</option><option value="concept">概念卡</option><option value="experiment">实验复盘</option></select><button id="docImport">导入 Markdown / JSON</button><input id="docImportFile" type="file" accept=".md,.txt,.json" hidden><input id="docImageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="docPreview">阅读预览</button></div>
<div class="doc-workspace"><aside class="doc-outline"><small>文档目录</small><nav id="docOutline"></nav><p>输入 / 插入内容块<br>Tab 缩进代码<br>Ctrl+S 保存</p></aside><article class="doc-page"><input id="docTitle" class="doc-title" aria-label="文档标题" maxlength="200" placeholder="无标题文档"><label class="doc-source">来源 / 文献定位<input id="docContext" maxlength="1000" placeholder="保留论文、章节和页码，方便回到证据"></label><div id="docBlocks" aria-label="文档内容"></div><button class="doc-add" id="docAdd">＋ 添加内容块，或在空白正文输入 /</button><p class="doc-foot">内容保存在本机数据库；草稿与版本可恢复。代码仅用于记录，不在文档中执行。</p></article><aside class="doc-assist"><span class="doc-kicker">THINK WITH EVIDENCE</span><h2>把记录，变成理解。</h2><p>选择一个内容块，保留你的判断，再让助手补充思路。</p><div class="doc-assist-actions"><button data-assist="explain">解释概念与条件</button><button data-assist="counterexample">检查反例与证据</button><button data-assist="questions">提出可验证问题</button><button data-assist="polish">改善表达</button></div><p id="docAssistStatus" role="status"></p><pre id="docSuggestion" hidden></pre><button id="docAccept" hidden>作为新引用块插入</button><section id="docVersions" hidden></section><button id="docCopy" hidden>将当前草稿另存副本</button><button id="docReload" hidden>载入服务器最新版本</button></aside></div></main>
<dialog id="drawDialog"><form method="dialog" class="draw-head"><b>可编辑绘图</b><button aria-label="关闭绘图">×</button></form><div class="draw-tools"><select id="drawTool" aria-label="绘图工具"><option value="pen">画笔</option><option value="rect">矩形</option><option value="arrow">箭头</option></select><input id="drawColor" type="color" value="#315cf5" aria-label="绘图颜色"><button id="drawUndo">撤销笔迹</button><button id="drawClear">清空</button></div><canvas id="drawCanvas" width="900" height="480" aria-label="绘图画布"></canvas><label>绘图说明<input id="drawCaption" maxlength="200" placeholder="给图添加说明"></label><button id="drawInsert" class="primary">保存到文档</button></dialog>
<script src="/assets/vendor/markdown-it-14.1.0.min.js"></script><script src="/assets/chat-content.js"></script><script src="/assets/academy-documents.js?v=20261002-release"></script></body></html>
