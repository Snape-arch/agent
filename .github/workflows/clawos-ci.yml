name: ClawOS CI

on:
  push:
    branches: ["master", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clawos/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deterministic test dependencies
        run: python -m pip install -r clawos/requirements-test.txt
      - name: Compile critical Python entrypoints
        run: >-
          python -m py_compile
          clawos/clawos_server.py
          clawos/agent_learning.py
          clawos/services/agentic_coding_loop_service.py
          clawos/services/product_readiness_service.py
          clawos/api/product_readiness.py
      - name: Check VS Code extension syntax
        run: node --check clawos/integrations/vscode/extension.js
      - name: Run isolated repository test shard
        run: python clawos/scripts/run_regression.py --pattern "test_*.py" --verbose --shard-count 4 --shard-index ${{ matrix.shard }}
      - name: Preserve test logs and selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-tests-${{ matrix.shard }}
          path: |
            clawos/output/regression/*/unittest.log
            clawos/output/regression/*/selection.json
            clawos/output/regression/*/summary.json
          if-no-files-found: warn
          retention-days: 14

  deterministic-tests:
    # Keep the existing required check name and fail if any shard fails/cancels.
    if: always()
    needs: test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = "success"
